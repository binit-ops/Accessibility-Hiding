name: Build APK

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  build:
    name: Build Module APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-read-only: false

      - name: Generate Gradle Wrapper (if not committed)
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew not found — generating..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug
          echo "DEBUG_APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)" >> $GITHUB_ENV

      - name: Build Release APK (Unsigned)
        run: |
          ./gradlew assembleRelease
          echo "RELEASE_APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -1)" >> $GITHUB_ENV

      # ── Signing (only on version tags) ──
      - name: Sign Release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/sign-android-release@v1
        id: sign_release
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      # ── Upload Artifacts ──
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hide-accessibility-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK (Unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: hide-accessibility-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release APK (Signed)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: hide-accessibility-release-signed
          path: ${{ steps.sign_release.outputs.signedReleaseFile }}
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Signed APK
        uses: actions/download-artifact@v4
        with:
          name: hide-accessibility-release-signed
          path: artifacts/

      - name: Get Version from Tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: .github/RELEASE_TEMPLATE.md
          files: |
            artifacts/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  nightly:
    name: Nightly Build
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Nightly
        uses: actions/upload-artifact@v4
        with:
          name: hide-accessibility-nightly
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
